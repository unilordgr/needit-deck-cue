name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Windows driver scripts
        run: node scripts/check-win-driver.js
      - name: Build installer and portable exe
        run: npx electron-builder --win --x64 --publish never
      - name: Build the Command Center
        run: npx electron-builder --win --x64 --config builder-center.json --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: needit-Deck-Cue-windows
          path: dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: needit-Command-Center-windows
          path: dist-center/*.exe
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build app (ad-hoc signed)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac dir --arm64 --publish never
          codesign --force --deep -s - "dist/mac-arm64/needit Deck Cue.app"
          (cd dist && ditto -c -k --keepParent "mac-arm64/needit Deck Cue.app" needit-Deck-Cue-mac-arm64.zip)
          npx electron-builder --mac dir --arm64 --config builder-center.json --publish never
          codesign --force --deep -s - "dist-center/mac-arm64/needit Command Center.app"
          (cd dist-center && ditto -c -k --keepParent "mac-arm64/needit Command Center.app" needit-Command-Center-mac-arm64.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: needit-Deck-Cue-mac
          path: dist/needit-Deck-Cue-mac-arm64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: needit-Command-Center-mac
          path: dist-center/needit-Command-Center-mac-arm64.zip
          if-no-files-found: error

  companion-module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion-module/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: needit-Deck-Cue-companion-module
          path: companion-module/*.tgz
          if-no-files-found: error

  release:
    # Pushing a v* tag publishes every build on the Releases page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac, companion-module]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Fixed file names, so the download buttons in the README always point at the latest release.
          mv artifacts/needit-deckcue-*.tgz artifacts/needit-deckcue-companion.tgz
          ls -la artifacts
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "needit Deck Cue and Command Center $TAG" --notes "Downloads for Windows and macOS (Apple Silicon), plus the Bitfocus Companion module. How to open the apps the first time: https://github.com/$GITHUB_REPOSITORY#opening-the-apps-the-first-time - Code signing policy: https://github.com/$GITHUB_REPOSITORY#code-signing-policy"
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
