name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Windows driver scripts
        run: node scripts/check-win-driver.js
      - name: Check the update helper (portable build)
        run: node scripts/check-update-scripts.js
      - name: Build installer and portable exe
        run: npx electron-builder --win --x64 --publish never
      - name: Build the Command Center
        run: npx electron-builder --win --x64 --config builder-center.json --publish never
      # The way the app updates an installed copy: the installer run silently, twice (fresh, then over itself).
      - name: Check that the installer installs and updates without questions
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'dist/needit-Deck-Cue-Setup.exe').Path
          # On the hosted runner the very first start of the fresh installer has crashed twice (0xC0000005 within
          # three seconds) while the same step passed on a second machine. Find out what it is: say which module
          # crashed, and try the same file again. The build fails only when all three tries fail; a warning is left
          # whenever a try crashed.
          $code = -1
          foreach ($try in 1..3) {
            $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
            $code = $p.ExitCode
            "silent install, try ${try}: exit code $code"
            if ($code -eq 0) { break }
            Start-Sleep -Seconds 3
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000 } -MaxEvents 2 -ErrorAction SilentlyContinue | ForEach-Object { "crash report: $($_.TimeCreated) $($_.Message -replace '\s+', ' ')" }
            Write-Host "::warning::The installer crashed when started silently (exit code $code, try $try)."
            Start-Sleep -Seconds 5
          }
          if ($code -ne 0) { throw "silent install ended with $code" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Filter 'needit Deck Cue.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'the app was not installed' }
          "installed at $($exe.FullName)"
          $p = Start-Process -FilePath $setup -ArgumentList '/S', '--updated' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent update ended with $($p.ExitCode)" }
          if (-not (Test-Path $exe.FullName)) { throw 'the app is gone after the update' }
          'installer: silent install and silent update ok'
      - uses: actions/upload-artifact@v4
        with:
          name: needit-Deck-Cue-windows
          path: dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: needit-Command-Center-windows
          path: dist-center/*.exe
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the update helper (app swap)
        run: node scripts/check-update-scripts.js
      - name: Build app (ad-hoc signed)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac dir --arm64 --publish never
          codesign --force --deep -s - "dist/mac-arm64/needit Deck Cue.app"
          (cd dist && ditto -c -k --keepParent "mac-arm64/needit Deck Cue.app" needit-Deck-Cue-mac-arm64.zip)
          npx electron-builder --mac dir --arm64 --config builder-center.json --publish never
          codesign --force --deep -s - "dist-center/mac-arm64/needit Command Center.app"
          (cd dist-center && ditto -c -k --keepParent "mac-arm64/needit Command Center.app" needit-Command-Center-mac-arm64.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: needit-Deck-Cue-mac
          path: dist/needit-Deck-Cue-mac-arm64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: needit-Command-Center-mac
          path: dist-center/needit-Command-Center-mac-arm64.zip
          if-no-files-found: error

  companion-module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion-module/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: needit-Deck-Cue-companion-module
          path: companion-module/*.tgz
          if-no-files-found: error

  release:
    # Pushing a v* tag publishes every build on the Releases page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac, companion-module]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # Fixed file names, so the download buttons in the README always point at the latest release.
          mv artifacts/needit-deckcue-*.tgz artifacts/needit-deckcue-companion.tgz
          # The signed list the apps check before they install an update (see src/update.js).
          node scripts/make-update-list.js artifacts "${TAG#v}"
          ls -la artifacts
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "needit Deck Cue and Command Center $TAG" --notes "Downloads for Windows and macOS (Apple Silicon), plus the Bitfocus Companion module. How to open the apps the first time: https://github.com/$GITHUB_REPOSITORY#opening-the-apps-the-first-time - Code signing policy: https://github.com/$GITHUB_REPOSITORY#code-signing-policy"
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
