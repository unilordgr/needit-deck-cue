<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262c38"/>
      <stop offset="1" stop-color="#0d1015"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe4ec"/>
    </linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a4e"/>
      <stop offset="1" stop-color="#e0262b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px rounded square centered on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  <g filter="url(#shadow)">
    <!-- top rail of the projection screen -->
    <rect x="232" y="222" width="560" height="44" rx="22" fill="#9aa4b4"/>
    <!-- screen -->
    <rect x="262" y="250" width="500" height="340" rx="22" fill="url(#screen)"/>
    <!-- slide content: chart bars -->
    <rect x="318" y="452" width="56" height="88" rx="10" fill="#4c8dff"/>
    <rect x="394" y="400" width="56" height="140" rx="10" fill="#19c26b"/>
    <rect x="470" y="340" width="56" height="200" rx="10" fill="#f5b400"/>
    <!-- slide title lines -->
    <rect x="318" y="300" width="208" height="20" rx="10" fill="#b8c0cc"/>
    <!-- stand -->
    <rect x="497" y="590" width="30" height="132" rx="10" fill="#9aa4b4"/>
    <path d="M512 700 L392 806" stroke="#9aa4b4" stroke-width="30" stroke-linecap="round"/>
    <path d="M512 700 L632 806" stroke="#9aa4b4" stroke-width="30" stroke-linecap="round"/>
  </g>
  <!-- red cue / GO play button -->
  <g filter="url(#shadow)">
    <circle cx="676" cy="560" r="122" fill="url(#go)"/>
    <circle cx="676" cy="560" r="122" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="12"/>
    <path d="M642 498 L742 560 L642 622 Z" fill="#ffffff" stroke="#ffffff" stroke-width="16" stroke-linejoin="round"/>
  </g>
</svg>
