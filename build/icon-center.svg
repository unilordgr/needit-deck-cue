<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262c38"/><stop offset="1" stop-color="#0d1015"/></linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe4ec"/></linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a4e"/><stop offset="1" stop-color="#e0262b"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <!-- links from the hub to three screens -->
  <g stroke="#9aa4b4" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M512 640 L512 470"/>
    <path d="M512 640 L290 470"/>
    <path d="M512 640 L734 470"/>
  </g>
  <!-- three show screens -->
  <g filter="url(#sh)">
    <rect x="196" y="262" width="188" height="140" rx="18" fill="url(#scr)"/>
    <rect x="222" y="344" width="30" height="34" rx="6" fill="#4c8dff"/><rect x="262" y="318" width="30" height="60" rx="6" fill="#4c8dff"/><rect x="302" y="292" width="30" height="86" rx="6" fill="#4c8dff"/>
    <rect x="418" y="226" width="188" height="140" rx="18" fill="url(#scr)"/>
    <rect x="444" y="308" width="30" height="34" rx="6" fill="#19c26b"/><rect x="484" y="282" width="30" height="60" rx="6" fill="#19c26b"/><rect x="524" y="256" width="30" height="86" rx="6" fill="#19c26b"/>
    <rect x="640" y="262" width="188" height="140" rx="18" fill="url(#scr)"/>
    <rect x="666" y="344" width="30" height="34" rx="6" fill="#f5b400"/><rect x="706" y="318" width="30" height="60" rx="6" fill="#f5b400"/><rect x="746" y="292" width="30" height="86" rx="6" fill="#f5b400"/>
  </g>
  <!-- the command hub: one GO button for all of them -->
  <g filter="url(#sh)">
    <circle cx="512" cy="676" r="132" fill="url(#go)"/>
    <circle cx="512" cy="676" r="132" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="12"/>
    <path d="M476 610 L582 676 L476 742 Z" fill="#fff" stroke="#fff" stroke-width="16" stroke-linejoin="round"/>
  </g>
</svg>
