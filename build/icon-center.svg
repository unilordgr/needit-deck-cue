<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a90f7"/><stop offset="1" stop-color="#1a43a6"/></linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3e8f1"/></linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a4e"/><stop offset="1" stop-color="#e0262b"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06163f" flood-opacity=".45"/></filter>
  </defs>
  <!-- macOS icon grid: 824px rounded square centred on a 1024 canvas. Blue, so it never reads as Deck Cue (graphite). -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>
  <!-- links from the command button to the three show computers -->
  <g stroke="#fff" stroke-opacity=".9" stroke-width="26" stroke-linecap="round" fill="none">
    <path d="M512 690 L512 400"/>
    <path d="M512 690 L286 476"/>
    <path d="M512 690 L738 476"/>
  </g>
  <!-- three show computers, each with a slide on its screen -->
  <g filter="url(#sh)">
    <rect x="166" y="296" width="240" height="172" rx="24" fill="url(#scr)"/>
    <rect x="204" y="394" width="38" height="42" rx="8" fill="#4c8dff"/><rect x="254" y="362" width="38" height="74" rx="8" fill="#4c8dff"/><rect x="304" y="330" width="38" height="106" rx="8" fill="#4c8dff"/>
    <rect x="618" y="296" width="240" height="172" rx="24" fill="url(#scr)"/>
    <rect x="656" y="394" width="38" height="42" rx="8" fill="#f5b400"/><rect x="706" y="362" width="38" height="74" rx="8" fill="#f5b400"/><rect x="756" y="330" width="38" height="106" rx="8" fill="#f5b400"/>
    <rect x="392" y="204" width="240" height="172" rx="24" fill="url(#scr)"/>
    <rect x="430" y="302" width="38" height="42" rx="8" fill="#19c26b"/><rect x="480" y="270" width="38" height="74" rx="8" fill="#19c26b"/><rect x="530" y="238" width="38" height="106" rx="8" fill="#19c26b"/>
  </g>
  <!-- one GO button for all of them -->
  <g filter="url(#sh)">
    <circle cx="512" cy="700" r="140" fill="url(#go)"/>
    <circle cx="512" cy="700" r="140" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width="14"/>
    <path d="M474 630 L586 700 L474 770 Z" fill="#fff" stroke="#fff" stroke-width="18" stroke-linejoin="round"/>
  </g>
</svg>
