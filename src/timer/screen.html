<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>needit Deck Cue — Timer</title>
  <link rel="stylesheet" href="screen.css">
</head>
<body>
  <div id="full" class="full" hidden>
    <img id="card" class="card" alt="" hidden>
    <div id="title" class="title"></div>
    <div id="fullTime" class="time">00:00</div>
    <div id="clock" class="clock"></div>
    <div id="hint" class="hint" hidden>Click anywhere to hide the timer</div>
  </div>
  <div id="pip" class="pip" hidden>
    <div id="pipLabel" class="pip-label" hidden></div>
    <div id="pipTime" class="pip-time">00:00</div>
  </div>
  <div id="msg" class="msg" hidden></div>
  <div id="frame" class="frame" hidden></div>
  <script src="screen.js"></script>
</body>
</html>
